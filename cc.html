(function () {
  console.log('[scroll-debug] script cargado');

  // selector que quieres observar; cámbialo por el tuyo
  const SELECTOR = '#cardName'; // <-- revisa que sea exactamente el selector en el DOM

  // función que intenta hacer scroll y muestra logs
  function tryScroll() {
    try {
      const el = document.querySelector(SELECTOR);
      if (!el) {
        console.log('[scroll-debug] elemento NO encontrado aún:', SELECTOR);
        return false;
      }
      console.log('[scroll-debug] elemento encontrado, haciendo scroll:', el);
      el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
      return true;
    } catch (err) {
      console.error('[scroll-debug] error en tryScroll:', err);
      return false;
    }
  }

  // Llamada inmediata por si ya existe
  if (tryScroll()) return;

  // 1) MutationObserver (ideal)
  console.log('[scroll-debug] iniciando MutationObserver...');
  const observer = new MutationObserver((mutations, obs) => {
    console.log('[scroll-debug] MutationObserver detectó cambios');
    if (tryScroll()) {
      console.log('[scroll-debug] scroll realizado por MutationObserver — desconectando');
      obs.disconnect();
      clearInterval(pollInterval);
    }
  });

  observer.observe(document.documentElement || document.body, {
    childList: true,
    subtree: true,
  });

  // 2) Fallback: polling cada 500ms (por si el contenido viene por XHR o framework que no dispara mutation de nodos directos)
  console.log('[scroll-debug] iniciando fallback polling cada 500ms...');
  const pollInterval = setInterval(() => {
    if (tryScroll()) {
      console.log('[scroll-debug] scroll realizado por polling — limpiando observer e intervalo');
      observer.disconnect();
      clearInterval(pollInterval);
    }
  }, 500);

  // 3) timeout para cortar la espera (evita loop infinito)
  setTimeout(() => {
    console.log('[scroll-debug] timeout 30s alcanzado — limpiando observer e intervalo');
    observer.disconnect();
    clearInterval(pollInterval);
  }, 30000);

  // 4) capturar errores globales por si algo detiene la ejecución
  window.addEventListener('error', e => {
    console.error('[scroll-debug] Captured window.error:', e.error || e.message, e);
  });
  window.addEventListener('unhandledrejection', e => {
    console.error('[scroll-debug] Captured unhandledrejection:', e.reason);
  });

})();

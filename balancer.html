/* Contenedor principal */
.dissabled {
    position: relative; /* Necesario para posicionar el texto y el blur */
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow: hidden; /* Evita que el blur se salga de los bordes */
    transition: all 0.3s ease;
}

/* Capa de desenfoque (Blur) */
.dissabled::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.4); /* Capa blanquecina semi-transparente */
    backdrop-filter: blur(6px); /* El efecto de desenfoque */
    -webkit-backdrop-filter: blur(6px); /* Soporte para Safari */
    z-index: 1;
}

/* Texto de "Deshabilitado" */
.dissabled::after {
    content: "Deshabilitado temporalmente";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    background-color: #333; /* Color de fondo del mensaje */
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 14px;
    text-transform: uppercase;
    white-space: nowrap;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

/* Deshabilitar interacción con los elementos internos (botones, links) */
.dissabled * {
    pointer-events: none;
    user-select: none;
}
